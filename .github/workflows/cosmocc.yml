# The patched cosmocc: the compilers of the official cosmocc 4.0.2, with
# the libc, the tools, the loaders and the headers of this branch (the
# changes of PATCHES.md). Each push and each pull request to main builds
# it and runs the checks of tool/cosmocc/check on each system, and the
# check C71 on NetBSD in a VM.
#
# A release publishes cosmocc-4.0.2-patched.N.zip, with SHA256SUMS and a
# provenance attestation. Two events start one:
#
# - The push of a tag 4.0.2-patched.N on a commit of main.
# - "Run workflow" on main with the input release = 4.0.2-patched.N. The
#   release job makes the tag on the commit of the run.
name: Patched cosmocc

on:
  push:
    branches: [main]
    tags: ["*-patched.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "The version to publish, for example 4.0.2-patched.1 (on main only). Empty: build and check only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COSMOCC_BASE: 4.0.2
  COSMOCC_BASE_SHA256: 85b8c37a406d862e656ad4ec14be9f6ce474c1b436b9615e91a55208aced3f44
  RELEASE: ${{ inputs.release }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A release by hand: only on main, a version of COSMOCC_BASE, and a
      # tag that does not exist yet.
      - name: Check the version of the release
        if: env.RELEASE != ''
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "A release by hand runs only on main, not on $GITHUB_REF." >&2
            exit 1
          fi
          if ! printf '%s\n' "$RELEASE" | grep -Eqx "${COSMOCC_BASE//./\\.}-patched\.[0-9]+"; then
            echo "The version $RELEASE is not $COSMOCC_BASE-patched.N." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE" > /dev/null; then
            echo "The tag $RELEASE exists already." >&2
            exit 1
          fi

      - name: Run APE programs on Linux
        run: |
          sudo cp build/bootstrap/ape.elf /usr/bin/ape
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register"

      # package.sh does not download the compilers when cosmocc/bin has
      # them. So the compilers are the ones of the official release, and
      # their SHA-256 is known.
      - name: Unpack the official cosmocc
        run: |
          zip=$RUNNER_TEMP/cosmocc.zip
          curl -fsSL -o "$zip" \
            "https://github.com/jart/cosmopolitan/releases/download/$COSMOCC_BASE/cosmocc-$COSMOCC_BASE.zip"
          echo "$COSMOCC_BASE_SHA256  $zip" | sha256sum -c -
          mkdir cosmocc
          unzip -q "$zip" -d cosmocc
          rm "$zip"

      - name: Build cosmocc
        run: NPROC=$(nproc) tool/cosmocc/package.sh cosmocc

      - name: Build the loader of Windows on ARM64
        run: |
          sudo apt-get install -y --no-install-recommends clang lld llvm
          ape/ape-arm64.sh cosmocc/bin/ape-arm64.exe
          cp PATCHES.md cosmocc/

      # C49: each PT_LOAD segment of the loader of x86_64 can be read.
      - name: Check the loader of x86_64
        run: |
          readelf -lW cosmocc/bin/ape-x86_64.elf |
            awk '$1 == "LOAD" { n++; if ($7 !~ /^R/) { print; bad = 1 } }
                 END { if (!n) bad = 1; exit bad }'

      - name: Pack cosmocc
        run: |
          case $GITHUB_REF in
            refs/tags/*) version=$GITHUB_REF_NAME ;;
            *) version=${RELEASE:-$COSMOCC_BASE-patched.dev} ;;
          esac
          mkdir out
          (cd cosmocc && zip -qry "../out/cosmocc-$version.zip" .)
          (cd out && sha256sum "cosmocc-$version.zip" > SHA256SUMS && cat SHA256SUMS)

      - name: Build the checks
        run: |
          mkdir checks
          cosmocc/bin/cosmocc -mcosmo -Os -o checks/hello.com tool/cosmocc/check/hello.c
          zip -qj checks/hello.com cosmocc/bin/ape-arm64.exe tool/cosmocc/check/hello.txt
          cosmocc/bin/cosmocc -mcosmo -Os -o checks/fixes.com tool/cosmocc/check/fixes.c
          cp cosmocc/bin/ape-arm64.exe cosmocc/bin/ape-x86_64.elf checks/

      # The same checks with the libc of the official cosmocc, for the
      # job on NetBSD: there, C71 must fail with this libc.
      - name: Build the checks with the official libc
        run: |
          zip=$RUNNER_TEMP/cosmocc.zip
          curl -fsSL -o "$zip" \
            "https://github.com/jart/cosmopolitan/releases/download/$COSMOCC_BASE/cosmocc-$COSMOCC_BASE.zip"
          echo "$COSMOCC_BASE_SHA256  $zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/official"
          unzip -q "$zip" -d "$RUNNER_TEMP/official"
          rm "$zip"
          "$RUNNER_TEMP/official/bin/cosmocc" -mcosmo -Os -o checks/fixes-official.com tool/cosmocc/check/fixes.c

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cosmocc
          path: out
          compression-level: 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checks
          path: checks

  check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, half: x86_64 }
          - { os: ubuntu-24.04-arm, half: aarch64 }
          - { os: macos-latest, half: aarch64 }
          - { os: windows-latest, half: x86_64 }
          - { os: windows-11-arm, half: aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: checks

      - name: Run the checks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x hello.com fixes.com
          ./hello.com one "two words" | tee hello.out
          grep -q "hello from the ${{ matrix.half }} half" hello.out
          ./fixes.com

      # On Windows on ARM64, hello.com starts its aarch64 half with the
      # loader of its zip. fixes.com runs both halves: the x86_64 half
      # under the x64 emulation, and the aarch64 half with the loader.
      - name: Run the checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = & ./hello.com one "two words"
          $code = $LASTEXITCODE
          $out
          if ($code) { exit $code }
          if (-not ($out -match "hello from the ${{ matrix.half }} half")) { exit 1 }
          & ./fixes.com
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ("${{ matrix.half }}" -eq "aarch64") {
            & ./ape-arm64.exe (Join-Path $PWD "fixes.com")
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

  # NetBSD in a VM (C71). The checks of this branch must pass C71, and
  # the checks with the official libc must fail it. Only the line of C71
  # decides: the job shows the other checks, but does not judge them.
  check-netbsd:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: checks

      - name: Install QEMU
        run: |
          for try in 1 2; do
            sudo timeout 120 apt-get update -q &&
              sudo timeout 600 apt-get install -y -q -o Acquire::Retries=3 --no-install-recommends \
                qemu-utils qemu-system-x86 ovmf &&
              exit 0
            echo "Try $try to install QEMU failed."
            sleep 10
          done
          exit 1

      - name: Run C71 on NetBSD
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1
        with:
          run: |
            chmod +x ape-x86_64.elf fixes.com fixes-official.com
            echo "== The checks with the libc of the official cosmocc"
            # Other checks can fail on NetBSD, and C71 fails with the
            # official libc. Thus the status of a run does not decide.
            ./ape-x86_64.elf ./fixes-official.com > official.out 2>&1 || echo "== Status: $?"
            cat official.out
            echo "== The checks of this branch"
            ./ape-x86_64.elf ./fixes.com > branch.out 2>&1 || echo "== Status: $?"
            cat branch.out
            grep -q '^FAIL: C71' official.out || { echo "C71 did not fail with the official libc"; exit 1; }
            grep -q '^PASS: C71' branch.out || { echo "C71 did not pass with this branch"; exit 1; }

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [build, check, check-netbsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cosmocc

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: cosmocc-*.zip

      # A release by hand makes its tag on the commit of the run.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case $GITHUB_REF in
            refs/tags/*) tag=$GITHUB_REF_NAME ;;
            *) tag=$RELEASE ;;
          esac
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "cosmocc $tag" \
            --notes "cosmocc $COSMOCC_BASE with the changes of PATCHES.md at $GITHUB_SHA. Check the file with SHA256SUMS, or with: gh attestation verify cosmocc-$tag.zip --repo $GITHUB_REPOSITORY" \
            "cosmocc-$tag.zip" SHA256SUMS
